<!DOCTYPE html>
<html lang="ko">

  <style>
    .ios-glass {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .dynamic-island {
      width: 110px;
      height: 30px;
      background-color: black;
      border-radius: 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ios-icon-shadow {
      box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.25), inset 0 1px 1px 0 rgba(255, 255, 255, 0.35);
    }
    @keyframes pulse-up {
      0% { transform: translateY(0); opacity: 0.8; }
      50% { transform: translateY(-6px); opacity: 1; }
      100% { transform: translateY(0); opacity: 0.8; }
    }
    .animate-pulse-up { animation: pulse-up 2s infinite ease-in-out; }
  </style>

    /* 🛡️ API 解析防错与极简口语生成器 */
    async function callOpenRouterAPI(characterRolePrompt, userMsg) {
      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "HTTP-Referer": window.location.origin || "https://localhost",
            "X-Title": "iOS Simulator",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openrouter/free",
            messages: [
              { 
                role: "system", 
                content: `${characterRolePrompt}\n【严格规则】：\n1. 必须精准围绕玩家发的内容回复。\n2. 极简日常口语化（1~2句短句）。\n3. 严禁出现 User Safety:、safe、finish_reason、[object Object] 等调试字符。\n4. 排版格式：\n韩文口语\n(中文翻译)` 
              },
              { role: "user", content: userMsg }
            ]
          })
        });

        if (!res.ok) return "응 고마워~ 밥 잘 챙겨 먹을게!\n(嗯谢谢~ 饭会好好吃的！)";
        const data = await res.json();
        let rawContent = data.choices?.[0]?.message?.content || "";
        rawContent = rawContent.replace(/User Safety:.*$/gi, '').replace(/\[object Object\]/g, '').replace(/finish_reason:.*$/gi, '').trim();
        return rawContent || "응 알겠어! 이따 보자~\n(嗯知道了！待会儿见~)";
      } catch (e) {
        return "응 알겠어! 이따 보자~\n(嗯知道了！待会儿见~)";
      }
    }

              </div>

                  <h4 class="font-bold text-sm text-gray-900 truncate">{{ contact.name }}</h4>

                <p class="text-[10px] text-gray-400 truncate">{{ contact.messages[contact.messages.length - 1]?.cn }}</p>
              </div>
            </div>
          </div>

          <div v-else class="flex-1 flex flex-col h-full overflow-hidden">
            <div class="flex-1 p-3 overflow-y-auto space-y-3">
              <div v-for="(msg, idx) in activeChat.messages" :key="idx" class="flex flex-col" :class="msg.sender === 'me' ? 'items-end' : 'items-start'">
                <div class="flex items-end space-x-1" :class="msg.sender === 'me' ? 'flex-row-reverse space-x-reverse' : ''">
                  <div class="max-w-[75%] p-2.5 rounded-xl text-xs" :class="msg.sender === 'me' ? 'bg-[#FFE812] text-gray-900' : 'bg-white text-gray-900 shadow-sm'">
                    <div>{{ msg.text }}</div>
                    <div v-if="msg.cn" class="text-[10px] opacity-60 mt-0.5 border-t border-black/10 pt-0.5">{{ msg.cn }}</div>
                  </div>
                  <span class="text-[9px] text-gray-500">{{ msg.time }}</span>
                </div>
              </div>
            </div>

            <div class="p-2 bg-white border-t flex items-center space-x-2">
              <input v-model="inputMessage" @keyup.enter="sendMessage" placeholder="메시지를 입력하세요..." class="flex-1 bg-gray-100 rounded-lg px-3 py-2 text-xs outline-none">
              <button @click="sendMessage" class="bg-yellow-400 text-gray-900 font-bold px-3 py-2 rounded-lg text-xs">전송</button>
            </div>
          </div>
        </div>
      `,
      methods: {
        openChat(contact) { this.activeChat = contact; this.story.kakaotalk.activeChatId = contact; contact.unread = 0; },
        async sendMessage() {
          if (!this.inputMessage.trim()) return;
          const text = this.inputMessage;
          this.activeChat.messages.push({ sender: 'me', text: text, cn: '发送消息', time: '방금' });
          this.inputMessage = '';

          const aiReplyFull = await callOpenRouterAPI(this.activeChat.systemPrompt, text);
          this.activeChat.messages.push({ sender: this.activeChat.id, text: aiReplyFull, cn: 'AI 实时口语回复', time: '방금' });

          if (this.activeChat.id === 'apro') {
            this.$emit('trigger-stage', 2);
          }
        }
      }
    };

        setInterval(() => {

            const unshownPool = NOTIF_POOL.filter(n => !this.shownNotifIds.has(n.id));
            if (unshownPool.length === 0) return;

            const notif = unshownPool[Math.floor(Math.random() * unshownPool.length)];
            this.shownNotifIds.add(notif.id);

            setTimeout(() => {

          if (diff < 0) {

          this.notifOffsetY = 0;

            if (this.activeNotification === notif) {

          } else if (notif.targetApp === 'x') {
            this.story.xTwitter.posts.unshift({
              id: Date.now(), author: notif.title.replace('@', ''), handle: '@user',
              avatar: DEFAULT_AVATAR_SVG,
              content: notif.message, cn: notif.cn, time: '방금 전', stage: this.story.currentStage, isAnti: false
            });
          }
        },
        handleNotificationClick(notif) {
          this.story.isLocked = false;
          this.openApp(notif.targetApp);
          this.activeNotification = null;
        },
        advanceStage(stageNum) { 
          this.story.currentStage = stageNum; 
          if (stageNum === 2) {
            this.story.kakaotalk.contacts.find(c => c.id === 'apro').messages.push({
              sender: 'apro', text: 'HEE, Death of Me 앨범 Apple Music 상단 등록 완료! 확인해봐!', cn: 'HEE，Death of Me 专辑已在 Apple Music 顶部上线！快去确认下！', time: '방금'
            });
          }
        },
        openLightbox(url) { this.lightboxUrl = url; },
        closeLightbox() { this.lightboxUrl = null; },
        
        /* 🎵 准确音频播放控制 */
        playSong(playlistId, trackIndex) {
          const playlist = this.story.appleMusic.playlists.find(p => p.id === playlistId);
          if (playlist && playlist.tracks[trackIndex]) {
            const track = playlist.tracks[trackIndex];
            this.audioState.currentSong = `${track.title} - ${track.artist}`;
            this.audioState.isPlaying = true;
            if (this.audioElement) {
              this.audioElement.src = track.audioUrl;
              this.audioElement.play().catch(e => console.log("Audio play caught", e));
            }
          }
        },
        togglePlay() {
          if (!this.audioElement.src) {
            this.playSong('hee', 0);
            return;
          }
          if (this.audioState.isPlaying) {
            this.audioElement.pause();
            this.audioState.isPlaying = false;
          } else {
            this.audioElement.play().catch(e => console.log("Toggle error", e));
            this.audioState.isPlaying = true;
          }
        },
        seekAudio(targetSec) {
          if (this.audioElement) {
            this.audioElement.currentTime = targetSec;
            this.audioState.currentTime = targetSec;
          }
        }
      }
    });

    app.component('app-kakaotalk', AppKakaotalk);
    app.component('app-x-twitter', AppXTwitter);
    app.component('app-instagram', AppInstagram);
    app.component('app-apple-music', AppAppleMusic);
    app.component('app-safari', AppSafari);
    app.component('app-notes', AppNotes);
    app.component('app-settings', AppSettings);
    app.component('app-weather', AppWeather);
    app.component('app-phone', AppPhone);
    app.component('app-calendar', AppCalendar);
    app.component('app-photos', AppPhotos);

    app.mount('#app');
  </script>
</body>
</html>
